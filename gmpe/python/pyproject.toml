[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ngaw2gmpe"
version = "0.1.0"
description = "NGA-West2 GMPE Python skeleton with shared coefficient loading"
requires-python = ">=3.9"
dependencies = [
  "numpy",
  "pandas",
  "openpyxl",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

